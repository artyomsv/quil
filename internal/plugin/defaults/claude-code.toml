# Claude Code — AI coding assistant
# Edit this file to customize the plugin. Delete it to restore defaults.

[plugin]
name = "claude-code"
display_name = "Claude Code"
category = "ai"
description = "AI coding assistant"
# 11: ghost_buffer false -> true. Bumped because the file a user already has
# OVERRIDES this one, so without it an existing install keeps the old default
# and never sees the change; the bump is what raises the migration dialog.
schema_version = 11

[command]
cmd = "claude"
# path = "/path/to/claude"  # uncomment to override PATH lookup
detect = "claude --version"
prompts_cwd = true  # ask user which folder to open Claude in (preserves .claude/ project context)
record_history = true  # capture submitted prompts to <quilDir>/history/<paneID>.jsonl (hook producer)
# Offer a "resume an existing session" pick-list in the setup dialog, listing
# the transcripts Claude recorded for the directory chosen above. Picking one
# spawns `--resume <id>` in place of the `--session-id <new-uuid>` start args
# below. Set to "" to always start a fresh session.
sessions = "claude"

# Runtime toggles — rendered in the pane setup dialog.
#
# The two permission-mode toggles below share group = "permission_mode",
# which makes them mutually exclusive: the setup dialog renders them as
# radio buttons, and enabling one automatically disables the other. Both
# default to false, so the user can also pick neither (Claude's standard
# interactive confirmations).
[[command.toggles]]
name = "dangerously_skip_permissions"
label = "Dangerously skip permissions (no confirmations)"
args_when_on = ["--dangerously-skip-permissions"]
default = false
group = "permission_mode"

[[command.toggles]]
name = "enable_auto_mode"
label = "Enable auto mode (safer than skipping permissions)"
args_when_on = ["--enable-auto-mode"]
default = false
group = "permission_mode"

# Chrome support is independent of the permission mode (no group), so it
# renders as a standalone checkbox the user can combine with either mode.
# Requires the "Claude in Chrome" browser extension (v1.0.36+) and
# claude >= 2.0.73; the flag only connects the CLI to the extension.
[[command.toggles]]
name = "chrome"
label = "Chrome support (Claude in Chrome extension)"
args_when_on = ["--chrome"]
default = false

[persistence]
strategy = "preassign_id"
# Scrollback is saved and replayed, so a reattached pane keeps its conversation
# history rather than only the current screen.
#
# This was false until 2026-08-01, on the stated grounds that replaying a
# full-screen app produces garbage rather than history. Measured against a real
# pane, that is not what happens: claude-code writes to the MAIN screen and
# scrolls normally — which is why you can scroll it while attached — so its
# output stream replays into coherent history. Both paths were checked, an
# in-memory replay after closing the TUI and a from-disk replay after a daemon
# restart, the second landing under a freshly respawned `--resume` process.
#
# The cost is that pane output is persisted under $QUIL_HOME/buffers, as it
# already is for every terminal pane. How much history comes back is bounded by
# [ghost_buffer] max_lines, and an AI pane spends that budget faster than a
# shell does because every repaint is bytes.
ghost_buffer = true
# Sent when a client attaches and the pane had NO replay to send — now only a
# brand-new pane, or one whose buffer was lost, since ghost_buffer above covers
# the rest.
#
# Ctrl+L (form feed) rather than a resize: claude-code re-lays-out on SIGWINCH
# but only paints on its own render tick, so a resize produces nothing at all.
# Measured on a real PTY — vim repaints with ~5 KB after a 1-column jiggle,
# claude-code emits 0 bytes from its main UI. Declaring a key also SUPPRESSES
# the resize fallback, which is correct here and wrong for a program that
# repaints on SIGWINCH; opencode is exactly that, and declaring one for it would
# replace a working mechanism with a no-op.
#
# This is INPUT rather than a signal, which is why it is opt-in per plugin: a
# program that reads its own stdin for data would receive this as data.
#
# The MEANING of the byte belongs to the program receiving it, and claude-code
# changed it: since v2.1.126, two Ctrl+L within two seconds run /clear and start
# a new conversation (fullscreen rendering, the default for newer installs). The
# daemon therefore rate-limits this key per pane — see redrawKeyCooldown in
# internal/daemon/redraw.go. Do not bypass that guard by writing a redraw key
# straight to a pane; issue #169 is what it costs.
redraw_key = "\f"
# Pre-assign a UUID to the new session so Quil can identify the pane.
start_args = ["--session-id", "{session_id}"]
# On restore, the daemon picks one of two templates per pane:
#
#   • If the pre-assigned session file exists on disk
#     (~/.claude/projects/<escaped-cwd>/<session_id>.jsonl), the daemon
#     promotes the resume args to ["--resume", "{session_id}"] so each
#     pane reattaches to its OWN session. This is what multi-pane users
#     actually want — without it, N panes sharing a CWD all converge on
#     claude's "most recent" session.
#
#   • If the file is missing (the pane was closed during claude's startup
#     screens — trust / model picker / mode select — before any exchange
#     could persist the session), the daemon uses the args below as a
#     fallback. --continue then uses claude's own "most recent in cwd"
#     lookup, which is robust to the timing of session-file creation.
#
# The fallback lives here in TOML; the --resume promotion lives in the
# daemon because the filesystem probe is claude-specific (see
# resumeTemplateFor in internal/daemon/daemon.go).
resume_args = ["--continue"]

[[error_handlers]]
pattern = '(?i)error.*API key not found|ANTHROPIC_API_KEY.*not set'
title = "API Key Missing"
message = "Set ANTHROPIC_API_KEY in your environment or run 'claude auth'."
action = "dialog"

# Idle handlers — checked when pane goes idle (last 5 lines analyzed)
[[idle_handlers]]
pattern = '(?i)waiting for (confirmation|input|approval|permission)'
title = "Needs your approval"
severity = "warning"

[[idle_handlers]]
pattern = '(?i)(plan|question|choose|select|pick)'
title = "Waiting for your choice"
severity = "warning"

[[idle_handlers]]
pattern = '❯|> $'
title = "Waiting for input"
severity = "info"

[display]
# Window-sized canvas: the PTY never resizes with the pane rect; small
# panes show a soft-wrapped preview. Zoom (Ctrl+E) shows the native render.
wide_canvas = true
