name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — test the workflow without side effects'
        type: boolean
        default: true

# Auto-supersede: a new push to a PR cancels the in-flight run for the previous
# commit instead of piling up (or waiting for a human to cancel it). Grouped
# per-branch so different PRs never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN, workflow-wide. Without this block both jobs
# inherit the repository default, which can be read+write — so a compromised
# third-party action (or one of its transitive deps) would hold a token able to
# push commits and edit releases, on a workflow that runs against PR branches.
# Neither job needs write: `test` checks out and builds, `changelog` checks out
# and diffs, and its ::error annotation goes over stdout rather than the API.
# A job that later needs more declares its own block, as release.yml does.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Hard cap so a hung step — historically an intermittent test-suite
    # deadlock — auto-fails here instead of running until someone cancels it.
    timeout-minutes: 15
    steps:
      - name: Dry run notice
        if: inputs.dry_run == true
        run: echo "::notice::DRY RUN — this is a manual test of the CI workflow"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: '1.25'

      - run: go vet ./...
      # -race targets the concurrency-bug class behind the intermittent hangs
      # (the project's go-testing rule requires CI to run with -race). -timeout
      # makes a deadlocked test fail fast WITH a full goroutine dump naming the
      # culprit, instead of hanging until the job timeout.
      - run: go test -race -timeout 300s ./...
      # The build tag keeps these out of the run above — and out of compilation
      # entirely, so without this step they are not even type-checked. They cover
      # what unit tests structurally cannot: that a handler is wired into the
      # dispatch at all, and that state survives snapshot → restore. Deleting a
      # `case ipc.Msg…:` arm left the whole suite green before this existed.
      - run: go test -tags=integration -race -timeout 300s ./...
      - run: go build ./cmd/quil && go build ./cmd/quild

      # Every step above runs on linux/amd64, so nothing behind
      # `//go:build windows` is compiled, vetted or analysed — not by go vet,
      # not by go test, not by CodeQL. internal/notify is mostly Windows COM
      # interop, registry writes and a named-pipe DACL, i.e. the highest-risk
      # code in the package sits in exactly the files CI cannot see. This
      # cross-compiles them so a break is caught here rather than on a user's
      # machine; no Windows runner needed.
      #
      # -unsafeptr=false is a targeted opt-out, not a blanket one: COM hands
      # back raw addresses that must be converted to pointers, and vet's
      # unsafeptr check has no way to express "this address is OS-owned and
      # outside the Go heap". Every other analyser still runs on these files.
      - name: cross-compile and vet Windows-only sources
        run: |
          GOOS=windows go build ./internal/notify/...
          GOOS=windows go vet -unsafeptr=false ./internal/notify/...
          # cmd/quil-activate is Windows-only in the same way, and it is the
          # binary a toast click actually runs — a break here is a click that
          # does nothing, discovered by a user rather than by CI. The -H
          # windowsgui link flag is included because it is the reason the
          # command exists; building without it would prove the wrong thing.
          GOOS=windows go build -ldflags "-H windowsgui" ./cmd/quil-activate/...
          GOOS=windows go vet ./cmd/quil-activate/...

      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh

      - name: installer regression test
        run: sh scripts/test-install.sh

      # promote-changelog.sh is the one release step that REWRITES CHANGELOG.md,
      # so a splicing bug there silently eats unreleased prose or released
      # history. It lives in scripts/ rather than inline in release.yml
      # precisely so it can be tested here, on every PR, before it ever runs
      # against the real file.
      - name: changelog promoter regression test
        run: sh scripts/test-promote-changelog.sh

  # The release workflow does not write changelog prose — it only collects the
  # fragments under `changelog.d/` into a version section. So an entry that is
  # not written HERE, while the author still has the context, is never written
  # at all: the version section ships empty and stays empty. Catching it at
  # release time (release.yml has that gate too, as a backstop) means blocking
  # a release on a changelog nobody remembers the details for.
  #
  # One file per PR, rather than a shared `## [Unreleased]` block, because every
  # PR editing the same anchor line made the second of two parallel PRs conflict
  # with the first as soon as it merged. Git has no conflict concept for two
  # distinct ADDED paths.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Require a changelog fragment for user-facing changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE=$(git merge-base "$BASE" "$HEAD")
          CHANGED=$(git diff --name-only "$MERGE_BASE" "$HEAD")
          echo "--- changed files ---"
          echo "$CHANGED"
          echo "---"

          # Directory hygiene, checked on EVERY pull request — including the
          # docs-only ones exempted from needing a fragment below. This is the
          # same code the release runs, so a fragment that would break the
          # release fails HERE instead, while the author is still looking at
          # it. It refuses a symlink (the promoter reads it through, so
          # `fixed-x.md -> ../.git/config` would publish the checkout's
          # credential header), a non-regular file, an empty fragment, and one
          # carrying a `## [` heading that would truncate the release notes.
          # --validate rather than --check: an exempt PR legitimately has
          # nothing to promote.
          #
          # Wrapped so the reason reaches the Files-changed tab as an
          # annotation. The script writes plain stderr, which lands only in
          # the raw log — every other failure in this job annotates, and a
          # gate whose reason you have to go digging for gets guessed at.
          if ! VALIDATION=$(sh scripts/promote-changelog.sh --validate 2>&1); then
            echo "$VALIDATION"
            echo "::error file=changelog.d/::Invalid changelog fragment — see the log for which file and why. A fragment must be a regular file (not a symlink) named changelog.d/<type>-<slug>.md, must not be empty, must carry a one-line 'headline:' front-matter block (except none-* and internal-*), and must not contain a '## [' heading. See changelog.d/README.md."
            exit 1
          fi
          echo "$VALIDATION"

          # Anything that reaches the binary. Test-only, docs-only, site-only
          # and workflow-only PRs are exempt — they can't change what a user
          # sees in the binary.
          #
          # This list MUST match release.yml's payload gate. The two used to
          # disagree: this job asked "which files changed?" while release.yml
          # asked "what type is the commit?", so a `fix(site):` PR was exempted
          # here and then bumped a version there, dying on the [Unreleased]
          # gate — a green PR that reliably turned master red (#130).
          # release-worthy and changelog-required have to be the SAME
          # question, or every divergence is another red master.
          #
          # A DENYLIST of what provably does not ship, not an allowlist of
          # what does — see release.yml for the full reasoning. Briefly: an
          # allowlist silently omits build inputs added later, and the first
          # version of this pair missed every Windows one (winres/ and
          # scripts/fetch-conpty.sh both feed .goreleaser.yml's before.hooks
          # and land in the shipped binaries).
          #
          # Non-obvious members: internal/plugin/defaults/*.toml and
          # internal/shellinit/*.sh are go:embed'ed, so a TOML-only change
          # really does change the binary — v1.28.0 shipped exactly that.
          # changelog.d/ is denied for the same reason as docs/: a typo fix in
          # a pending fragment would otherwise read as payload and cut a
          # release whose five platform binaries are identical to the last tag.
          CODE=$(echo "$CHANGED" \
            | grep -vE '^(site|docs|tools|techdebt|marketing|\.github|\.claude|changelog\.d)/' \
            | grep -vE '^[^/]+\.md$' \
            | grep -vE '^(VERSION|LICENSE|Makefile|package-lock\.json|\.gitignore|\.gitattributes|\.editorconfig|\.dockerignore)$' \
            | grep -v '_test\.go$' || true)
          if [ -z "$CODE" ]; then
            echo "::notice::No changes reach the binary — changelog fragment not required"
            exit 0
          fi

          # --diff-filter=A: the fragment must be NEW. The previous gate asked
          # only whether CHANGELOG.md was touched, which an edit to an
          # already-released section satisfied.
          #
          # The name grammar is NOT written out here. promote-changelog.sh owns
          # it, and this gate pipes candidates through the same script the
          # release runs, because a gate that can disagree with the action it
          # guards is exactly how #130 (v1.49.0 -> v1.49.1) turned master red:
          # a PR passes review, then the release dies on a rule the PR was
          # never checked against.
          FRAGMENTS=$(git diff --name-status --diff-filter=A "$MERGE_BASE" "$HEAD" \
            | cut -f2 | sh scripts/promote-changelog.sh --filter-names)
          if [ -n "$FRAGMENTS" ]; then
            echo "::notice::changelog fragment(s) added: $(echo "$FRAGMENTS" | tr '\n' ' ')"
            exit 0
          fi

          echo "::error file=changelog.d/::This PR changes production code but adds no changelog fragment. Create changelog.d/<type>-<slug>.md describing the change from a user's point of view, where <type> is one of added, changed, deprecated, removed, fixed, security, internal. The file holds the bullet text only — the release workflow adds the version header and section heading, and cannot write the prose for you. If the change is genuinely invisible to users (pure refactor, internal cleanup), add changelog.d/none-<slug>.md to say so explicitly. See changelog.d/README.md; validate locally with 'sh scripts/promote-changelog.sh --check'."
          exit 1
