name: Deploy site (quil.cc)

# Builds the Astro project at site/ and deploys to GitHub Pages.
#
# Triggers:
#   - push to master when site/** changes (the common case)
#   - push to master when this workflow file itself changes
#   - workflow_dispatch (manual rebuild from the Actions tab)
#
# Pages source must be set to "GitHub Actions" in repo settings:
#   Settings → Pages → Source → GitHub Actions.
# The first run will fail until that is flipped. After that, it just
# works on every push.
#
# Custom domain: site/public/CNAME contains "quil.cc" which gets
# copied to dist/CNAME at build time. GitHub Pages reads it on deploy.
# DNS records must be set at the registrar:
#   A    @   185.199.108.153
#   A    @   185.199.109.153
#   A    @   185.199.110.153
#   A    @   185.199.111.153
#   CNAME www artyomsv.github.io
# TLS is provisioned automatically by GitHub Pages via Let's Encrypt.

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Pages requires only one in-flight deploy per environment. Cancel a
# previous run if a new push comes in while it's still building.
concurrency:
  group: pages
  cancel-in-progress: true

# Least privilege, split per job rather than granted workflow-wide.
#
# The build job below runs `npm ci` over the Astro dependency tree, which
# executes third-party install scripts. Granting it `pages: write` would let a
# compromised dependency publish arbitrary content to quil.cc, and
# `id-token: write` would let it mint an OIDC token carrying this repo's
# identity, exchangeable with any cloud provider configured to trust
# repo:artyomsv/quil. It needs neither: upload-pages-artifact is tar plus
# actions/upload-artifact, which authenticates with ACTIONS_RUNTIME_TOKEN and
# never touches the Pages API or GITHUB_TOKEN.
#
# Only deploy runs deploy-pages, so only deploy gets those two scopes. Note
# that a job-level block REPLACES this one rather than merging with it, which
# is why deploy restates contents: read.
#
# GitHub's own Pages starter workflow puts all three here at the top level;
# that is convenience, not least privilege.
permissions:
  contents: read

jobs:
  build:
    name: Build with Astro
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: src/lib/lastmod.ts derives each page's sitemap
          # <lastmod> from `git log -1 --format=%cI -- <file>`. The default
          # depth-1 clone has exactly one commit, so that command returns
          # the SAME date for every file — the deploy time — and every URL
          # in the sitemap claims to have changed on every deploy.
          #
          # It fails silently and looks correct: the sitemap validates, the
          # dates are real, and only comparing two of them reveals they are
          # identical. Measured 2026-08-23: all 14 URLs carried
          # lastmod 2026-08-23T13:32:28Z.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # create the Pages deployment
      id-token: write   # OIDC token deploy-pages exchanges for the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
