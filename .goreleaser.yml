version: 2

before:
  hooks:
    # Fetch the bundled ConPTY host (conpty.dll + OpenConsole.exe) that the
    # Windows build embeds via go:embed. The binaries are gitignored, so the
    # release runner fetches them before building. See scripts/fetch-conpty.sh.
    - sh scripts/fetch-conpty.sh
    - go install github.com/tc-hib/go-winres@v0.3.3
    - go-winres make --in winres/winres.json --out cmd/quil/rsrc --product-version {{ .Version }} --file-version {{ .Version }}
    - go-winres make --in winres/winres.json --out cmd/quild/rsrc --product-version {{ .Version }} --file-version {{ .Version }}
    - go mod tidy -diff
    - go vet ./...

builds:
  - id: quil
    main: ./cmd/quil
    binary: quil
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: quild
    main: ./cmd/quild
    binary: quild
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  # The windowless handler for desktop-toast clicks. Windows only, and
  # -H windowsgui is the entire point: it is what makes the process have no
  # console window. A console binary launched for a click shows a real window
  # that takes the foreground and then vanishes when the handler exits, leaving
  # focus on a window that no longer exists — after which the user types into
  # nothing.
  #
  # amd64 only, matching the other two — the windows/arm64 ignore below is the
  # same exclusion expressed by omission, since this build lists no arm64.
  - id: quil-activate
    main: ./cmd/quil-activate
    binary: quil-activate
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -H windowsgui -X main.version={{.Version}}

archives:
  - id: default
    ids:
      - quil
      - quild
      # Present in every archive, including the Unix ones, where it builds to
      # nothing: goreleaser simply has no artifact for those platforms, so the
      # tarballs are unchanged. Naming it here is what puts it in the Windows
      # zip BESIDE quil.exe, which is where `quil notify setup` looks for it.
      - quil-activate
    # Required BECAUSE of the line above, and releases were broken for two
    # versions without it. quil-activate is windows/amd64 only, so this archive
    # holds three binaries on Windows and two everywhere else — and goreleaser
    # treats an uneven count as a mistake by default ("may cause your users
    # confusion") and refuses to build ANY archive, failing the whole release
    # at the archives step, after the binaries have already cross-compiled.
    #
    # The failure is invisible from the release job: the bump/tag half runs
    # first and succeeds, so master gets a version bump, a CHANGELOG section
    # and a tag, and only the publish half dies. v1.56.0 and v1.57.0 are both
    # tagged with no GitHub Release behind them, which is why `quil update` and
    # scripts/install.sh — which read the releases API, not tags — kept
    # offering v1.55.2.
    allow_different_binary_count: true
    name_template: "quil_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Explicit, because the defaults are wrong in both directions. The default
    # globs are LICENSE*, README* and CHANGELOG*, which MISS `NOTICE` and
    # `MIT-LICENSE.txt` — and Apache-2.0 makes both an obligation rather than a
    # courtesy: §4(a) says recipients get the licence, §4(d) says they get the
    # NOTICE, and LICENSE itself points at MIT-LICENSE.txt, so shipping one
    # without the other puts a dangling reference in a legal document.
    #
    # THIRD_PARTY_LICENSES.md carries Microsoft's MIT notice for the OpenConsole
    # binaries that internal/pty/winconpty embeds into the Windows build. MIT
    # requires that notice to travel with copies of the software, and the
    # binary in this archive is one.
    #
    # The globs also sweep IN `changelog.d/README.md` — the contributor guide to
    # writing fragments, which reached every user download of v1.63.0 and
    # earlier. Listing files explicitly drops it.
    files:
      - LICENSE
      - MIT-LICENSE.txt
      - NOTICE
      - TRADEMARK.md
      - THIRD_PARTY_LICENSES.md
      - README.md
      - CHANGELOG.md
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

release:
  github:
    owner: artyomsv
    name: quil
  # Upload assets to a HIDDEN draft. The release becomes public only when the
  # workflow's final "Publish" step flips the draft — so an interruption during
  # asset upload leaves an invisible draft, never a partial PUBLIC release. See
  # release.yml (goreleaser job) for the flip + the recovery path.
  draft: true
  prerelease: auto
  name_template: "v{{.Version}}"
