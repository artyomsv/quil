name: Release

# Single-person repo: cuts the release commit and tag with a direct push to
# master. The `master` ruleset requires PR review for ordinary pushes, but
# you (artyomsv) are listed as a ruleset bypass_actor with bypass_mode
# "always" — that bypass only applies to YOUR identity, not the ephemeral
# `github-actions[bot]` GITHUB_TOKEN. So the checkout below authenticates
# with the `RELEASE_PAT` secret (a fine-grained PAT owned by you) instead of
# the default token — every git push in this job then runs as you, which the
# ruleset lets straight through. No release PR, no second review step.
#
# Without RELEASE_PAT the job falls back to GITHUB_TOKEN and the push WILL be
# rejected by the ruleset once branch protection is enforced — see the warning
# step below.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — compute version but skip commit, tag, and release'
        type: boolean
        default: true
      publish_tag:
        description: 'Recovery: publish an existing tag (e.g. v1.35.0) whose Release never went public. Skips the version bump/commit; (re)runs GoReleaser + publish for that tag.'
        type: string
        default: ''

env:
  DRY_RUN: ${{ inputs.dry_run || false }}

# Serialize releases: if two pushes to master land close together, queue the
# second run rather than let two release jobs race on the tag/commit. Never
# cancel-in-progress — a release must not be interrupted mid tag-and-push.
concurrency:
  group: release
  cancel-in-progress: false

# Read-only floor for GITHUB_TOKEN. Both jobs below raise themselves to
# `contents: write` because they genuinely need it, so this changes nothing
# today — it exists so a job added LATER inherits read-only instead of the
# repository default, which can be read+write. That silent inheritance is
# exactly the state ci.yml was in.
#
# Note this bounds only the auto-minted GITHUB_TOKEN. The release job checks
# out with RELEASE_PAT when that secret is set, and a PAT's authority is
# whatever the PAT was granted -- no `permissions:` block constrains it. See
# the header for why the bot token cannot be used for the version-bump push.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Hard cap so a hung step (e.g. an intermittent test-suite deadlock) auto-
    # fails instead of running for 15+ min until someone cancels it — the exact
    # toil this workflow kept causing.
    timeout-minutes: 15
    permissions:
      contents: write  # commit + tag version bump
    # Skip release commits to prevent infinite loop
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    outputs:
      version: ${{ steps.bump.outputs.version }}
      skip: ${{ steps.bump.outputs.skip }}
      # Sourced from the bump step (not env) so recovery mode can force it false
      # even when the workflow_dispatch dry_run box is left at its default.
      dry_run: ${{ steps.bump.outputs.dry_run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          # Persisted by actions/checkout as the git credential for every
          # push in this job — see the header note on why this must be a
          # user-owned PAT, not the default bot token.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Warn if RELEASE_PAT is missing
        # secrets can't be used in a step `if:`, so map presence to env and
        # branch inside the script.
        env:
          HAS_PAT: ${{ secrets.RELEASE_PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::RELEASE_PAT secret is not set. The release push will run as github-actions[bot], which is NOT a ruleset bypass actor — the 'git push --atomic origin master' below will be rejected by the master branch ruleset. Add the RELEASE_PAT secret (see release.yml header)."
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: '1.25'

      - name: Determine version bump
        id: bump
        # PUBLISH_TAG via env (not inline ${{ }}) so the user-supplied input
        # can't be interpolated into the shell — no script-injection surface.
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          # Recovery: publish an existing tag without cutting a new version.
          # Triggered via workflow_dispatch with publish_tag=vX.Y.Z when a prior
          # run pushed the tag but its GitHub Release never went public. Skips
          # bump/commit/tag; goreleaser then (re)publishes that tag.
          if [ -n "$PUBLISH_TAG" ]; then
            V="${PUBLISH_TAG#v}"
            echo "version=${V}" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
            echo "::notice::Recovery publish for v${V} — skipping bump/commit/tag"
            exit 0
          fi
          # Normal mode: this run's dry_run flag flows to the goreleaser gate.
          echo "dry_run=${DRY_RUN}" >> $GITHUB_OUTPUT

          CURRENT=$(cat VERSION)
          LAST_TAG="v${CURRENT}"
          echo "current=${CURRENT}" >> $GITHUB_OUTPUT

          # Scan SUBJECTS only for type-bump classification. A previous
          # version of this script also scanned commit bodies ("%s%n%b"),
          # which produced a false-positive minor bump on PR #35 (docs
          # restructure) because the PR description contained the literal
          # string `feat(tui): add Stop daemon action` — a back-tick-wrapped
          # reference to another open PR — that the body regex matched as
          # if it were a real `feat(tui):` commit. The squash subject set
          # by the merger is the authoritative classification; if a
          # contributor's branch-name-derived subject is non-conventional
          # the `[(:/]` regex below still accepts `feat/foo-bar` form.
          #
          # BREAKING CHANGE is read from bodies because per the Conventional
          # Commits spec it lives in the footer, not the subject. The
          # `^BREAKING[ -]CHANGE:` anchor matches the footer form
          # specifically (line-start + colon) so prose references like
          # "this is not a BREAKING CHANGE" do NOT match.
          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            SUBJECTS=$(git log "${LAST_TAG}..HEAD" --format='%s')
            BODIES=$(git log "${LAST_TAG}..HEAD" --format='%b')
          else
            SUBJECTS=$(git log --format='%s')
            BODIES=$(git log --format='%b')
          fi

          echo "--- Subjects since ${LAST_TAG} ---"
          echo "$SUBJECTS"
          echo "---"

          if [ -z "$SUBJECTS" ]; then
            echo "::notice::No commits since last tag — skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Nothing that reaches the binary => nothing to release.
          #
          # This gate exists because ci.yml and this workflow used to answer
          # "is this user-facing?" DIFFERENTLY. ci.yml's changelog job decides
          # by changed FILES and exempts site-only PRs; this step decided by
          # commit TYPE alone. So `fix(site):` passed PR review with no
          # changelog entry, then bumped a patch here and died on the
          # [Unreleased] gate below — green PR, red master, every time. That
          # is what happened to #130 (1.49.0 -> 1.49.1).
          #
          # Cutting the release anyway would be worse than failing: it
          # publishes five platform binaries byte-identical to the previous
          # tag, so users get an update notification for a CSS change.
          #
          # Expressed as a DENYLIST of things that provably do not ship,
          # not an allowlist of things that do. An allowlist fails toward
          # silently NOT releasing, which is the worst outcome available
          # here: a user-facing fix that never reaches anyone and produces
          # no signal that it didn't. Review caught exactly that — the
          # first version listed cmd/ internal/ go.mod go.sum and so missed
          # every Windows build input. .goreleaser.yml's before.hooks are
          # the proof: `sh scripts/fetch-conpty.sh` fetches the conpty.dll
          # and OpenConsole.exe that the Windows build go:embeds, and
          # `go-winres make --in winres/winres.json` links .syso icon and
          # version resources into both binaries. A winres-only or
          # fetch-conpty-only fix is a real shipped change. Inverting it
          # means a build input added LATER counts by default.
          #
          # Non-obvious members, all verified rather than assumed:
          # internal/plugin/defaults/*.toml and internal/shellinit/*.sh are
          # go:embed'ed (v1.28.0 shipped lazysql.toml and nothing else);
          # go.mod alone changes the binary (v0.10.2); .goreleaser.yml
          # controls ldflags and platforms.
          #
          # Deliberately a RANGE-level check, not a per-commit one. Pairing
          # "changed code" with "declares a type" assumes both live on the
          # same commit; that holds for squash-merged PRs but not for a
          # trigger commit. v1.33.1 is the counter-example — #84 carried 15
          # Go files under a non-conventional subject and #85 (`fix: publish
          # merged...`) carried the type with no code. Per-commit pairing
          # never cuts that release at all.
          #
          # Backtested over all 109 tag boundaries: 17 differ, and every one
          # changed nothing outside the denied paths.
          #
          # Keep this list in sync with ci.yml's `changelog` job.
          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            PAYLOAD=$(git diff --name-only "${LAST_TAG}..HEAD" \
              | grep -vE '^(site|docs|tools|techdebt|marketing|\.github|\.claude)/' \
              | grep -vE '^[^/]+\.md$' \
              | grep -vE '^(VERSION|LICENSE|Makefile|package-lock\.json|\.gitignore|\.gitattributes|\.editorconfig|\.dockerignore)$' \
              | grep -v '_test\.go$' || true)
            if [ -z "$PAYLOAD" ]; then
              echo "::notice::No changes reach the binary since ${LAST_TAG} (docs/site/workflow only) — skipping release"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Determine bump type from conventional commits.
          # - `-i` for case-insensitivity: GitHub's squash-merge auto-capitalizes
          #   branch-name-derived subjects (`feat/x` -> `Feat/x`).
          # - `\b` word boundary: prevents `defeated` / `unfeatured` from
          #   accidentally matching `feat`.
          # - `[(:/]`: accepts `feat:`, `feat(scope):`, AND `feat/branch-name`
          #   (the last appears when the squash subject came from the branch).
          if echo "$SUBJECTS" | grep -qiE '\b(feat!|fix!|refactor!)[(:/]?' \
             || echo "$BODIES" | grep -qE '^BREAKING[ -]CHANGE:'; then
            BUMP="major"
          elif echo "$SUBJECTS" | grep -qiE '\bfeat[(:/]'; then
            BUMP="minor"
          elif echo "$SUBJECTS" | grep -qiE '\b(fix|perf)[(:/]'; then
            BUMP="patch"
          else
            echo "::notice::No version-bumping commits found (only chore/docs/test/ci) — skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Calculate new version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "bump=${BUMP}" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "::notice::Version bump: ${CURRENT} → ${NEW_VERSION} (${BUMP})"

      - name: Require a non-empty [Unreleased] section
        # The release "generator" does NOT write changelog prose — it only
        # inserts a `## [X.Y.Z] - DATE` header above whatever is already under
        # `## [Unreleased]`. So a PR that ships without an Unreleased entry
        # produces a version section that is permanently empty in CHANGELOG.md.
        # That silently happened 42 times (v0.10.2 through v1.40.0), including
        # feature releases: quil status, split-border drag, auto-update, the
        # pane context menu, and the command palette's content search all
        # shipped with no changelog entry at all.
        #
        # The goreleaser job's fallback (generate notes from commits) only
        # rescues the GitHub Release *page* — CHANGELOG.md itself stays blank
        # forever, and backfilling it later is archaeology. Fail here instead,
        # BEFORE the version bump is committed and tagged, so the fix is a
        # one-line commit rather than a released-with-no-notes version.
        #
        # Escape hatch for a release with genuinely nothing to tell users
        # (CI-only, refactor-only): put the sentinel line below in
        # `## [Unreleased]`. It is deliberately an explicit, greppable
        # statement — "nothing to say" and "forgot to write it" must not look
        # identical to this check.
        #
        # One failure here is NOT the author's fault: when two PRs merge
        # back-to-back, this job checks out master at trigger time, so run #1
        # can sweep BOTH entries into version #1 and leave run #2 with an empty
        # section. That is how v1.32.1's macOS fixes ended up filed under
        # v1.32.0, and v1.40.0's palette content search under v1.39.0. If this
        # gate fires immediately after another release, check whether the
        # previous version's section is holding this one's entry, and move it
        # down rather than writing a new one.
        if: steps.bump.outputs.skip != 'true' && inputs.publish_tag == ''
        run: |
          UNRELEASED=$(sed -n '/^## \[Unreleased\]/,/^## \[/{ /^## \[Unreleased\]/d; /^## \[/d; p; }' CHANGELOG.md)
          if [ -z "$(printf '%s' "$UNRELEASED" | tr -d '[:space:]')" ]; then
            echo "::error file=CHANGELOG.md::The [Unreleased] section is empty — refusing to cut a release with no changelog entry. Add one under '## [Unreleased]' describing the change from a user's point of view, or, if this release genuinely has nothing user-facing, add the literal line '_No user-facing changes._' there."
            exit 1
          fi
          echo "::notice::[Unreleased] section present ($(printf '%s\n' "$UNRELEASED" | wc -l) lines)"

      - name: Update version files
        if: steps.bump.outputs.skip != 'true' && inputs.publish_tag == ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          echo "$VERSION" > VERSION

          # Update CHANGELOG: insert versioned header after [Unreleased]
          DATE=$(date +%Y-%m-%d)
          sed -i "s/## \[Unreleased\]/## [Unreleased]\n\n## [${VERSION}] - ${DATE}/" CHANGELOG.md

          # Bump the marketing site's version pill so quil.cc reflects the
          # release. seo.ts is the single source of truth for the home page
          # hero pill — without this update the site keeps showing the old
          # version even though the binary moved on. This file is included in
          # the release commit below, so the push that follows triggers
          # site.yml (path-filtered on site/**) with the correct version
          # already baked in — that is the ONLY thing that deploys the site;
          # see the "Commit version bump and tag" step for why there is no
          # separate deploy job here.
          sed -i -E "s/(version: )\"[0-9]+\\.[0-9]+\\.[0-9]+\"/\\1\"${VERSION}\"/" site/src/data/seo.ts
          sed -i -E "s/(releaseDate: )\"[0-9]{4}-[0-9]{2}-[0-9]{2}\"/\\1\"${DATE}\"/" site/src/data/seo.ts

          echo "::notice::Updated VERSION to ${VERSION}, CHANGELOG.md, and site/src/data/seo.ts"

      - name: Run tests
        if: steps.bump.outputs.skip != 'true' && inputs.publish_tag == ''
        run: |
          go vet ./...
          # -race + bounded -timeout: a deadlocked test fails fast with a
          # goroutine dump instead of hanging the release job to its timeout.
          go test -race -timeout 300s ./...

      - name: Dry run summary
        if: steps.bump.outputs.skip != 'true' && env.DRY_RUN == 'true' && inputs.publish_tag == ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          echo "::warning::DRY RUN — skipping commit, tag, and release"
          echo "Would have released: v${VERSION}"
          echo "Bump type: ${BUMP}"

      - name: Commit version bump and tag
        # This push (via RELEASE_PAT, not the loop-prevention-exempt
        # GITHUB_TOKEN) touches site/src/data/seo.ts, so it triggers a fresh
        # site.yml run on its own — from a commit that already has the
        # correct version baked in. That is deliberately the ONLY thing that
        # deploys quil.cc: release.yml used to ALSO rebuild+deploy the site
        # itself in a dedicated job after goreleaser, to force an
        # "authoritative" redeploy over a stale in-flight site.yml build.
        # That guard against a rare ordering race introduced a much more
        # common one — the two deploys landing back-to-back made GitHub
        # Pages' API reject the second attempt outright ("Deployment failed,
        # try again later"), which is what actually happened on the PR that
        # removed this job (see its description for the concrete failure).
        # Exactly one deploy pathway, from a commit that is always correct,
        # beats two deploy pathways arbitrated by a concurrency group.
        if: steps.bump.outputs.skip != 'true' && env.DRY_RUN != 'true' && inputs.publish_tag == ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md site/src/data/seo.ts
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          # --atomic: land the release commit and its tag together or not at
          # all. If this push is interrupted (e.g. the job timeout-minutes cap
          # firing, or a network stall), the server applies both refs or
          # neither — never the commit without the tag (or vice versa), which
          # would otherwise leave a half-released state needing manual cleanup.
          # Push the specific tag rather than --tags so only this release's tag
          # is part of the atomic unit.
          git push --atomic origin master "v${VERSION}"
          echo "::notice::Tagged v${VERSION}"

  goreleaser:
    needs: release
    if: needs.release.outputs.skip != 'true' && needs.release.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    # Cross-compiles 5 platforms + publishes assets — give it more room than the
    # release job, but still bounded so a stuck upload can't hang indefinitely.
    timeout-minutes: 30
    permissions:
      contents: write  # publish GitHub release assets
    steps:
      - name: Validate version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::Invalid or empty version: '$VERSION'"
            exit 1
          }

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: v${{ needs.release.outputs.version }}
          fetch-depth: 0  # GoReleaser needs full history for tag resolution

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: '1.25'

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # IMPORTANT: write the file inside GITHUB_WORKSPACE, not /tmp.
          # `hashFiles()` (used in `if:` conditions on later steps) only
          # matches files inside GITHUB_WORKSPACE, so a /tmp path always
          # hashes to empty string and any guarded step gets skipped.
          # See: https://docs.github.com/en/actions/learn-github-actions/expressions#hashfiles
          sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG.md \
            | tr -d '\r' > release-notes.md
          echo "::notice::Release notes for v${VERSION} ($(wc -c < release-notes.md) bytes):"
          cat release-notes.md

      - name: Clear any leftover draft for this tag
        # Recovery-safe idempotency: if a prior interrupted run left a DRAFT
        # release for this tag, delete it so GoReleaser can recreate it cleanly
        # (GoReleaser errors on a pre-existing release). ONLY a draft is removed
        # — an already-published release is never touched — and the tag itself
        # is kept (--cleanup-tag=false). No-op on a normal first release.
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh release view "v${VERSION}" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "v${VERSION}" --yes --cleanup-tag=false
            echo "::notice::Removed leftover draft for v${VERSION} before re-publish"
          fi

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a  # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release notes
        # The release body must NEVER be empty. The CHANGELOG section is the
        # preferred source, but when a PR ships without a `## [Unreleased]`
        # entry that section is empty (this produced blank release pages on
        # v1.29.0 and v1.31.0). In that case we fall back to GitHub's
        # commit/PR-generated notes so every release has a description.
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Treat a whitespace-only section as empty: the extract step emits a
          # lone newline (1 byte) for an empty CHANGELOG section, which `[ -s ]`
          # wrongly accepts as non-empty — that bug shipped v1.31.1 with a blank
          # body. Strip whitespace and test for genuinely-empty content.
          #
          # The "_No user-facing changes._" sentinel (see the release job's
          # [Unreleased] gate) counts as empty HERE on purpose: it is an honest
          # thing to keep in CHANGELOG.md, but a useless release page. Falling
          # through to the generated notes gives readers the commits instead.
          if grep -qx '_No user-facing changes\._' release-notes.md; then
            echo "::notice::CHANGELOG section for v${VERSION} is the no-user-facing-changes sentinel — generating notes from commits/PRs"
            : > release-notes.md
          fi
          if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
            echo "::warning::CHANGELOG section for v${VERSION} is empty — generating notes from commits/PRs"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="v${VERSION}" --jq .body > release-notes.md
          fi
          if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
            echo "::error::Could not produce release notes for v${VERSION}"
            exit 1
          fi
          gh release edit "v${VERSION}" --notes-file release-notes.md
          echo "::notice::Release notes applied to v${VERSION}"

      - name: Publish release
        # Final, atomic step: flip the draft to public ONLY after every asset is
        # uploaded (GoReleaser) and the notes are set. Any earlier interruption
        # leaves a hidden draft — never a partial PUBLIC release. Recovery is to
        # re-run this job, or dispatch the workflow with publish_tag=v${VERSION}.
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${VERSION}" --draft=false
          echo "::notice::Published v${VERSION}"

  # --- Site deploy ------------------------------------------------------
  # There is deliberately no site-deploy job here. site.yml (path-filtered on
  # site/**) is the ONLY thing that ever deploys quil.cc, triggered by the
  # "Commit version bump and tag" push above (it touches site/src/data/seo.ts
  # with the version already bumped). site.yml carries its own top-level
  # `concurrency: {group: pages, cancel-in-progress: true}`, so if the
  # original merge push ALSO happened to touch site/** (a docs/site PR bundled
  # with the release-worthy commit), that earlier, stale-content site.yml run
  # is a run of the very same workflow/group and is guaranteed to be
  # cancelled-or-superseded by this strictly-later, correct-content run —
  # no separate job or shared concurrency group needed to arbitrate between
  # two different workflows. See CHANGELOG / git history for why a redundant
  # deploy-site job briefly existed here and why it was removed (it made two
  # independent deploys of the SAME correct content race each other, and
  # GitHub Pages' API rejected the second one outright).
