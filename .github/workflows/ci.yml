name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — test the workflow without side effects'
        type: boolean
        default: true

# Auto-supersede: a new push to a PR cancels the in-flight run for the previous
# commit instead of piling up (or waiting for a human to cancel it). Grouped
# per-branch so different PRs never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN, workflow-wide. Without this block both jobs
# inherit the repository default, which can be read+write — so a compromised
# third-party action (or one of its transitive deps) would hold a token able to
# push commits and edit releases, on a workflow that runs against PR branches.
# Neither job needs write: `test` checks out and builds, `changelog` checks out
# and diffs, and its ::error annotation goes over stdout rather than the API.
# A job that later needs more declares its own block, as release.yml does.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Hard cap so a hung step — historically an intermittent test-suite
    # deadlock — auto-fails here instead of running until someone cancels it.
    timeout-minutes: 15
    steps:
      - name: Dry run notice
        if: inputs.dry_run == true
        run: echo "::notice::DRY RUN — this is a manual test of the CI workflow"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: '1.25'

      - run: go vet ./...
      # -race targets the concurrency-bug class behind the intermittent hangs
      # (the project's go-testing rule requires CI to run with -race). -timeout
      # makes a deadlocked test fail fast WITH a full goroutine dump naming the
      # culprit, instead of hanging until the job timeout.
      - run: go test -race -timeout 300s ./...
      # The build tag keeps these out of the run above — and out of compilation
      # entirely, so without this step they are not even type-checked. They cover
      # what unit tests structurally cannot: that a handler is wired into the
      # dispatch at all, and that state survives snapshot → restore. Deleting a
      # `case ipc.Msg…:` arm left the whole suite green before this existed.
      - run: go test -tags=integration -race -timeout 300s ./...
      - run: go build ./cmd/quil && go build ./cmd/quild

      # Every step above runs on linux/amd64, so nothing behind
      # `//go:build windows` is compiled, vetted or analysed — not by go vet,
      # not by go test, not by CodeQL. internal/notify is mostly Windows COM
      # interop, registry writes and a named-pipe DACL, i.e. the highest-risk
      # code in the package sits in exactly the files CI cannot see. This
      # cross-compiles them so a break is caught here rather than on a user's
      # machine; no Windows runner needed.
      #
      # -unsafeptr=false is a targeted opt-out, not a blanket one: COM hands
      # back raw addresses that must be converted to pointers, and vet's
      # unsafeptr check has no way to express "this address is OS-owned and
      # outside the Go heap". Every other analyser still runs on these files.
      - name: cross-compile and vet Windows-only sources
        run: |
          GOOS=windows go build ./internal/notify/...
          GOOS=windows go vet -unsafeptr=false ./internal/notify/...

      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh

      - name: installer regression test
        run: sh scripts/test-install.sh

  # The release workflow only inserts a version header above whatever is under
  # `## [Unreleased]` — it never writes prose. So an entry that is not written
  # HERE, while the author still has the context, is never written at all: the
  # version section ships empty and stays empty. Catching it at release time
  # (release.yml has that gate too, as a backstop) means blocking a release on
  # a changelog nobody remembers the details for.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG entry for user-facing changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          echo "--- changed files ---"
          echo "$CHANGED"
          echo "---"

          # Anything that reaches the binary. Test-only, docs-only, site-only
          # and workflow-only PRs are exempt — they can't change what a user
          # sees in the binary.
          #
          # This list MUST match release.yml's payload gate. The two used to
          # disagree: this job asked "which files changed?" while release.yml
          # asked "what type is the commit?", so a `fix(site):` PR was exempted
          # here and then bumped a version there, dying on the [Unreleased]
          # gate — a green PR that reliably turned master red (#130).
          # release-worthy and changelog-required have to be the SAME
          # question, or every divergence is another red master.
          #
          # A DENYLIST of what provably does not ship, not an allowlist of
          # what does — see release.yml for the full reasoning. Briefly: an
          # allowlist silently omits build inputs added later, and the first
          # version of this pair missed every Windows one (winres/ and
          # scripts/fetch-conpty.sh both feed .goreleaser.yml's before.hooks
          # and land in the shipped binaries).
          #
          # Non-obvious members: internal/plugin/defaults/*.toml and
          # internal/shellinit/*.sh are go:embed'ed, so a TOML-only change
          # really does change the binary — v1.28.0 shipped exactly that.
          CODE=$(echo "$CHANGED" \
            | grep -vE '^(site|docs|tools|techdebt|marketing|\.github|\.claude)/' \
            | grep -vE '^[^/]+\.md$' \
            | grep -vE '^(VERSION|LICENSE|Makefile|package-lock\.json|\.gitignore|\.gitattributes|\.editorconfig|\.dockerignore)$' \
            | grep -v '_test\.go$' || true)
          if [ -z "$CODE" ]; then
            echo "::notice::No changes reach the binary — changelog entry not required"
            exit 0
          fi

          if echo "$CHANGED" | grep -qx 'CHANGELOG.md'; then
            echo "::notice::CHANGELOG.md updated"
            exit 0
          fi

          echo "::error file=CHANGELOG.md::This PR changes production code but does not touch CHANGELOG.md. Add an entry under '## [Unreleased]' describing the change from a user's point of view — the release workflow copies that section verbatim and cannot write it for you. If the change is genuinely invisible to users (pure refactor, internal cleanup), add the literal line '_No user-facing changes._' under '## [Unreleased]' to say so explicitly."
          exit 1
